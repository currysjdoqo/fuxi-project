version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuxi-backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:80,http://localhost,http://127.0.0.1,http://43.108.18.169,http://43.108.18.169:80,http://43.108.18.169:8000,https://43.108.18.169
      - WRONG_QUESTION_REMOVE_THRESHOLD=${WRONG_QUESTION_REMOVE_THRESHOLD:-5}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    networks:
      - fuxi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fuxi-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fuxi-network
    restart: unless-stopped

networks:
  fuxi-network:
    driver: bridge