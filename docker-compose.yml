version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fuxi-backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:80,http://localhost,http://127.0.0.1,http://43.108.18.169,http://43.108.18.169:80
      - WRONG_QUESTION_REMOVE_THRESHOLD=${WRONG_QUESTION_REMOVE_THRESHOLD:-5}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    networks:
      - fuxi-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fuxi-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fuxi-network
    restart: unless-stopped

networks:
  fuxi-network:
    driver: bridge

volumes:
  fuxi-data:
  fuxi-uploads: